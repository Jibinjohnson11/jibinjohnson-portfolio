[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://www.jibinjohnson.in/*"
  to = "https://jibinjohnson.in/:splat"
  status = 301
  force = true

# Python and Django is no longer a separate service; its old page goes to full-stack development
[[redirects]]
  from = "/python-django-developer-kerala"
  to = "/full-stack-developer-kerala/"
  status = 301
  force = true

[[redirects]]
  from = "/python-django-developer-kerala/*"
  to = "/full-stack-developer-kerala/"
  status = 301
  force = true
